# helix org bots apply -f support-bot.yaml   (field names match the REST API)
id: support-acme
name: Acme support
content_file: support-bot.prompt.md
skills_dir: skills/                   # optional: <name>/SKILL.md folders → the bot repo's .agents/skills/
code_agent_runtime: opencode          # opencode | deepseek_harness | qwen_code | claude_code | codex_cli
code_agent_credential_type: api_key
provider: ds4-flash-node06            # provider endpoint name or pe_… id (helix provider list)
model: glm-5.3-flash
reasoning_effort: none
sandbox_runtime: headless-ubuntu
preserve_context: false
instance_profile:
  sandbox_runtime: headless-ubuntu
  mcp_servers: [chrome-devtools]
  tools: []                           # e.g. [get_secret] — must also be in the bot's tools
  helix_skills: false
